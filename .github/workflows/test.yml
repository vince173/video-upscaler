name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Verify FFmpeg installation
        run: ffmpeg -version

      - name: Install Edge WebDriver (Windows)
        if: runner.os == 'Windows'
        run: |
          # Download Edge WebDriver
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://msedgedriver.azureedge.net/LATEST_RELEASE" -OutFile "latest_version.txt"
          $version = Get-Content "latest_version.txt"
          $arch = if ([Environment]::Is64BitOperatingSystem) { "64" } else { "32" }
          $url = "https://msedgedriver.azureedge.net/$version/edgedriver_win${arch}.zip"
          Invoke-WebRequest -Uri $url -OutFile "msedgedriver.zip"
          Expand-Archive -Path "msedgedriver.zip" -DestinationPath "." -Force
          # Add to PATH for this session
          $env:PATH += ";$PWD"
          echo "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install tauri-driver
        run: cargo install tauri-driver

      - name: Generate test fixtures
        run: npm run test:fixtures

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results/
            junit-results/
          retention-days: 7
